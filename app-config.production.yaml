app:
  baseUrl: ${APP_BASE_URL}

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen: ':7007'
  database:
    client: pg
    connection:
      host:     ${POSTGRES_HOST}
      port:     ${POSTGRES_PORT}
      user:     ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
      ssl:
        rejectUnauthorized: true
        # For AWS RDS with a custom CA, uncomment and point to the RDS CA bundle:
        # ca:
        #   $file: /etc/ssl/certs/rds-ca-bundle.pem

auth:
  providers:
    guest: {}

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Group, User]
  locations:
    # Core catalog entities
    - type: file
      target: ./examples/entities.yaml

    # Scaffolder templates
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/react-template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/nextjs-template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/fastapi-template/template.yaml
      rules:
        - allow: [Template]

    # Org structure
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [User, Group]
