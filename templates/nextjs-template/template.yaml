apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nextjs-modular-template
  title: Next.js Frontend (Modular Monolith)
  description: Production-ready Next.js 14 app — modular structure, TYN branding, optional shared UI components. Runs on first `npm install && npm run dev`.
  tags:
    - nextjs
    - frontend
    - typescript
    - tailwind
spec:
  owner: group:platform-team
  type: website

  parameters:
    - title: Application Details
      required:
        - name
        - owner
      properties:
        name:
          title: Application Name
          type: string
          description: Lowercase, hyphen-separated (e.g. billing-portal). Becomes the repo name.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One line — what does this app do?
        owner:
          title: Owner (Team)
          type: string
          description: Team that owns this service.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Shared UI Components
      description: Select TYN shared components to include in this repo. They are copied as local files now; will be replaced with @tyn/ui-* CodeArtifact packages later.
      properties:
        sharedButton:
          title: TYN Button
          description: Company-standard Button component with TYN branding and variants.
          type: boolean
          default: false
        sharedNavbar:
          title: TYN Navbar
          description: Company-standard top navigation bar with logo and links.
          type: boolean
          default: false

  steps:
    - id: fetch-base
      name: Fetch Next.js Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description if parameters.description else 'A Next.js application by The Yellow Network' }}
          owner: ${{ parameters.owner }}
          sharedButton: ${{ parameters.sharedButton }}
          sharedNavbar: ${{ parameters.sharedNavbar }}

    - id: fetch-shared-button
      name: Add TYN Button Component
      if: ${{ parameters.sharedButton }}
      action: fetch:template
      input:
        url: ./shared-components/button
        targetPath: ./src/shared/components
        values:
          name: ${{ parameters.name }}

    - id: fetch-shared-navbar
      name: Add TYN Navbar Component
      if: ${{ parameters.sharedNavbar }}
      action: fetch:template
      input:
        url: ./shared-components/navbar
        targetPath: ./src/shared/components
        values:
          name: ${{ parameters.name }}

    # TODO: Replace with publish:awsCodeCommit targeting labs/${{ parameters.name }}
    - id: publish
      name: Publish Repository (GitHub — swap for CodeCommit later)
      action: publish:github
      input:
        description: ${{ parameters.description if parameters.description else parameters.name }}
        repoUrl: github.com?repo=${{ parameters.name }}&owner=Riyaz-TYN
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Open Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: View in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
