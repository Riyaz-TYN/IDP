apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nextjs-modular-template
  title: Next.js Frontend (Modular Monolith)
  description: Production-ready Next.js 14 app — shadcn/ui + TYN Tailwind config included by default. Runs on first `npm install && npm run dev`. Auto-added to the umbrella repo under labs/frontend/.
  tags:
    - nextjs
    - frontend
    - typescript
    - tailwind
    - shadcn
spec:
  owner: group:platform-team
  type: website

  parameters:
    - title: Application Details
      required:
        - name
        - owner
      properties:
        name:
          title: Application Name
          type: string
          description: Lowercase, hyphen-separated (e.g. billing-portal). Becomes the repo name.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One line — what does this app do?
        owner:
          title: Owner (Team)
          type: string
          description: Team that owns this service.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

  steps:
    - id: fetch-base
      name: Fetch Next.js Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description if parameters.description else 'A Next.js application by The Yellow Network' }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description if parameters.description else parameters.name }}
        repoUrl: github.com?repo=${{ parameters.name }}&owner=Riyaz-TYN
        defaultBranch: main
        repoVisibility: private

    - id: add-to-umbrella
      name: Add to Umbrella Repo (labs/frontend)
      action: monorepo:submodule:add
      input:
        repoUrl: https://github.com/Riyaz-TYN/Umberella-Repo.git
        submoduleUrl: ${{ steps['publish'].output.remoteUrl }}
        submodulePath: labs/frontend/${{ parameters.name }}

    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Open Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: View in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
